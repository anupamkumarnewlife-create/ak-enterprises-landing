<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Leads - AK Enterprises CRM</title>
<link rel="icon" href="assets/ak-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0f2d3a; --muted:#5c7480; --line:rgba(17,50,64,0.12);
    --teal:#0b7f9c; --teal-dark:#0a6b84; --green:#2ba84a; --red:#c0392b;
    --bg:#f4f8fa; --card:#ffffff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Mulish',sans-serif;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font-family:'Mulish',sans-serif}
  [hidden]{display:none !important}

  .wrap{max-width:1180px;margin:0 auto;padding:0 16px}

  /* ---------- login ---------- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  #login .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px rgba(17,50,64,0.12);padding:30px 26px}
  #login img{height:44px;display:block;margin:0 auto 20px}
  #login h1{font:800 21px/1.2 Nunito,sans-serif;margin:0 0 6px;text-align:center}
  #login p.sub{font:500 13.5px/1.5 Mulish,sans-serif;color:var(--muted);margin:0 0 22px;text-align:center}
  label{display:block;font:700 12.5px/1 Mulish,sans-serif;margin:0 0 7px}
  input[type=email],input[type=password],input[type=search]{
    width:100%;background:#f4f8fa;border:1.5px solid var(--line);border-radius:11px;
    padding:13px 14px;font:500 15px/1 Mulish,sans-serif;color:var(--ink);outline:none}
  input:focus{border-color:var(--teal);background:#fff;box-shadow:0 0 0 4px rgba(11,127,156,0.12)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;
    border-radius:999px;font:800 14px/1 Nunito,sans-serif;padding:14px 22px;background:var(--teal);color:#fff}
  .btn:hover{background:var(--teal-dark)}
  .btn:disabled{opacity:.6;cursor:default}
  .btn.wide{width:100%;margin-top:20px;padding:16px}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-size:13px;padding:10px 16px}
  .btn.ghost:hover{background:#eaf4f7;color:var(--teal)}
  .err{margin:16px 0 0;font:700 13px/1.5 Mulish,sans-serif;color:var(--red)}
  .hint{margin:18px 0 0;padding-top:16px;border-top:1px solid var(--line);font:500 12.5px/1.6 Mulish,sans-serif;color:var(--muted)}

  /* ---------- app chrome ---------- */
  header.bar{background:var(--ink);color:#fff;padding:12px 0;position:sticky;top:0;z-index:20}
  header.bar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header.bar img{height:32px;background:#fff;border-radius:8px;padding:4px 7px}
  header.bar h1{font:800 16px/1 Nunito,sans-serif;margin:0;flex:1 1 auto}
  header.bar .btn.ghost{background:rgba(255,255,255,0.1);color:#fff;border-color:rgba(255,255,255,0.28)}
  header.bar .btn.ghost:hover{background:rgba(255,255,255,0.2);color:#fff}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:18px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .stat b{display:block;font:800 24px/1.1 Nunito,sans-serif}
  .stat span{font:700 11px/1 Mulish,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}

  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
  .controls input[type=search]{flex:1 1 220px;min-width:0}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;
    font:700 12.5px/1 Mulish,sans-serif;color:var(--muted);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

  .leads{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;padding-bottom:60px}
  .lead{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
  .lead .top{display:flex;align-items:flex-start;gap:10px}
  .lead .who{flex:1 1 auto;min-width:0}
  .lead .who b{display:block;font:800 16px/1.3 Nunito,sans-serif;word-break:break-word}
  .lead .who time{font:600 12px/1.4 Mulish,sans-serif;color:var(--muted)}
  .tag{font:800 10px/1 Mulish,sans-serif;letter-spacing:1px;text-transform:uppercase;
    padding:6px 9px;border-radius:999px;background:#e3f1f6;color:var(--teal);white-space:nowrap}
  .lead dl{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:7px 12px;
    font:500 13.5px/1.4 Mulish,sans-serif}
  .lead dt{font-weight:700;color:var(--muted)}
  .lead dd{margin:0;word-break:break-word}
  .actions{display:flex;gap:8px;margin:14px 0 0}
  .actions a{flex:1 1 0;text-align:center;text-decoration:none;border-radius:999px;padding:11px 8px;
    font:800 12.5px/1 Nunito,sans-serif}
  .actions .call{background:var(--teal);color:#fff}
  .actions .wa{background:var(--green);color:#fff}
  .row{display:flex;gap:8px;align-items:center;margin:12px 0 0}
  select.status{flex:1 1 auto;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;
    font:700 13px/1 Mulish,sans-serif;background:#f4f8fa;color:var(--ink)}
  textarea.notes{width:100%;margin:10px 0 0;border:1.5px solid var(--line);border-radius:10px;padding:10px;
    font:500 13px/1.5 Mulish,sans-serif;resize:vertical;min-height:56px;background:#f4f8fa;color:var(--ink)}
  textarea.notes:focus,select.status:focus{outline:none;border-color:var(--teal);background:#fff}
  .saved{font:700 11.5px/1 Mulish,sans-serif;color:var(--green)}

  .empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:48px 20px;
    text-align:center;color:var(--muted);font:600 15px/1.6 Mulish,sans-serif}

  @media (max-width:600px){
    .leads{grid-template-columns:1fr}
    header.bar h1{font-size:15px}
  }
</style>
</head>
<body>

<!-- ============================ login ============================ -->
<section id="login">
  <form class="box" onsubmit="return akLogin(event)">
    <img src="assets/ak-logo.png" alt="AK Enterprises" />
    <h1>Leads Dashboard</h1>
    <p class="sub">Sign in to see your enquiries</p>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required />

    <div style="height:16px"></div>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required />

    <button type="submit" class="btn wide" id="loginBtn">SIGN IN</button>
    <p class="err" id="loginErr" hidden></p>

    <p class="hint">
      No login yet? Create one in Supabase &rarr; Authentication &rarr; Users &rarr;
      <b>Add user</b>, using an email that is on the CRM allow-list.
    </p>
  </form>
</section>

<!-- ============================= app ============================= -->
<div id="app" hidden>
  <header class="bar">
    <div class="wrap">
      <img src="assets/ak-logo.png" alt="AK Enterprises" />
      <h1>Leads</h1>
      <button class="btn ghost" onclick="akLoad()">Refresh</button>
      <button class="btn ghost" onclick="akExport()">Export CSV</button>
      <button class="btn ghost" onclick="akLogout()">Sign out</button>
    </div>
  </header>

  <main class="wrap">
    <div class="stats" id="stats"></div>

    <div class="controls">
      <input type="search" id="search" placeholder="Search name, mobile or area..." oninput="akRender()" />
      <div class="chips" id="chips"></div>
    </div>

    <div class="leads" id="leads"></div>
  </main>
</div>

<script>
(function () {
  'use strict';

  var URL_BASE = 'https://yasmylhhnltrgufwsxoe.supabase.co';
  var KEY = 'sb_publishable_K-YcEeRGFhuGsMspFP1kfQ_BgeJTR7H';
  var STORE = 'ak_crm_session';

  var STATUSES = ['new', 'contacted', 'quoted', 'won', 'lost', 'spam'];
  var TYPE_LABEL = {
    roof: 'Roof & Terrace', bathroom: 'Bathroom & Walls', basement: 'Basement',
    tank: 'Water Tank', pool: 'Swimming Pool', other: 'Other'
  };

  var session = null;
  var leads = [];
  var filter = 'all';

  /* ---------------- session ---------------- */
  function loadSession() {
    try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { return null; }
  }
  function saveSession(s) {
    session = s;
    try { s ? localStorage.setItem(STORE, JSON.stringify(s)) : localStorage.removeItem(STORE); } catch (e) {}
  }

  function authFetch(path, opts, isRetry) {
    opts = opts || {};
    var headers = opts.headers || {};
    headers['apikey'] = KEY;
    headers['Authorization'] = 'Bearer ' + (session && session.access_token);
    opts.headers = headers;

    return fetch(URL_BASE + path, opts).then(function (res) {
      if (res.status === 401 && !isRetry && session && session.refresh_token) {
        return refresh().then(function () { return authFetch(path, opts, true); });
      }
      return res;
    });
  }

  function refresh() {
    return fetch(URL_BASE + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    }).then(function (res) {
      if (!res.ok) { saveSession(null); showLogin('Your session expired. Please sign in again.'); throw new Error('refresh failed'); }
      return res.json();
    }).then(saveSession);
  }

  /* ---------------- login ---------------- */
  function showLogin(msg) {
    document.getElementById('app').hidden = true;
    document.getElementById('login').hidden = false;
    var box = document.getElementById('loginErr');
    box.textContent = msg || '';
    box.hidden = !msg;
  }

  window.akLogin = function (e) {
    e.preventDefault();
    var btn = document.getElementById('loginBtn');
    var errBox = document.getElementById('loginErr');
    errBox.hidden = true;
    btn.disabled = true; btn.textContent = 'SIGNING IN...';

    fetch(URL_BASE + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      })
    }).then(function (res) {
      return res.json().then(function (body) { return { ok: res.ok, body: body }; });
    }).then(function (r) {
      btn.disabled = false; btn.textContent = 'SIGN IN';
      if (!r.ok) {
        errBox.textContent = r.body.error_description || r.body.msg || 'Wrong email or password.';
        errBox.hidden = false;
        return;
      }
      saveSession(r.body);
      document.getElementById('password').value = '';
      start();
    }, function () {
      btn.disabled = false; btn.textContent = 'SIGN IN';
      errBox.textContent = 'Network error. Check your connection.';
      errBox.hidden = false;
    });

    return false;
  };

  window.akLogout = function () {
    saveSession(null);
    leads = [];
    showLogin('');
  };

  /* ---------------- data ---------------- */
  window.akLoad = function () {
    return authFetch('/rest/v1/leads?select=*,lead_surveys(leak_location,duration,tried_before)&order=created_at.desc&limit=1000', {})
      .then(function (res) {
        if (res.status === 401 || res.status === 403) { saveSession(null); showLogin('That account is not on the CRM allow-list.'); return null; }
        if (!res.ok) throw new Error('load failed: ' + res.status);
        return res.json();
      })
      .then(function (rows) {
        if (!rows) return;
        leads = rows;
        akRender();
      })
      .catch(function (err) {
        if (window.console) console.error('[crm]', err);
        document.getElementById('leads').innerHTML =
          '<p class="empty">Could not load leads. Tap Refresh to try again.</p>';
      });
  };

  function patch(id, body, el) {
    return authFetch('/rest/v1/leads?id=eq.' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) throw new Error('save failed: ' + res.status);
      if (el) {
        el.textContent = 'Saved';
        setTimeout(function () { el.textContent = ''; }, 1800);
      }
      var row = leads.filter(function (l) { return l.id === id; })[0];
      if (row) { for (var k in body) row[k] = body[k]; }
    }).catch(function (err) {
      if (window.console) console.error('[crm]', err);
      if (el) el.textContent = 'Not saved';
    });
  }

  /* ---------------- render ---------------- */
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function when(iso) {
    var d = new Date(iso);
    return d.toLocaleString('en-IN', {
      day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true
    });
  }

  function digits(m) { return String(m || '').replace(/\D/g, ''); }
  function waNumber(m) {
    var d = digits(m);
    if (d.length === 10) d = '91' + d;
    return d;
  }

  function visible() {
    var q = document.getElementById('search').value.trim().toLowerCase();
    return leads.filter(function (l) {
      if (filter !== 'all' && l.status !== filter) return false;
      if (!q) return true;
      return (l.name + ' ' + l.mobile + ' ' + l.area).toLowerCase().indexOf(q) !== -1;
    });
  }

  function renderStats() {
    var now = new Date();
    var startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    var weekAgo = now.getTime() - 7 * 864e5;
    var t = 0, w = 0;
    leads.forEach(function (l) {
      var ms = new Date(l.created_at).getTime();
      if (ms >= startToday) t++;
      if (ms >= weekAgo) w++;
    });
    var count = function (s) { return leads.filter(function (l) { return l.status === s; }).length; };

    var cells = [
      ['Total leads', leads.length], ['New', count('new')], ['Today', t],
      ['Last 7 days', w], ['Won', count('won')]
    ];
    document.getElementById('stats').innerHTML = cells.map(function (c) {
      return '<div class="stat"><b>' + c[1] + '</b><span>' + c[0] + '</span></div>';
    }).join('');
  }

  function renderChips() {
    var all = [['all', 'All']].concat(STATUSES.map(function (s) {
      return [s, s.charAt(0).toUpperCase() + s.slice(1)];
    }));
    document.getElementById('chips').innerHTML = all.map(function (c) {
      var n = c[0] === 'all' ? leads.length : leads.filter(function (l) { return l.status === c[0]; }).length;
      return '<button class="chip" aria-pressed="' + (filter === c[0]) + '" data-f="' + c[0] + '">' +
             esc(c[1]) + ' ' + n + '</button>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('#chips .chip'), function (b) {
      b.onclick = function () { filter = b.getAttribute('data-f'); akRender(); };
    });
  }

  window.akRender = function () {
    renderStats();
    renderChips();

    var rows = visible();
    var host = document.getElementById('leads');

    if (!rows.length) {
      host.innerHTML = '<p class="empty">' +
        (leads.length ? 'No leads match this filter.' : 'No leads yet. They will appear here the moment someone submits the form.') +
        '</p>';
      return;
    }

    host.innerHTML = rows.map(function (l) {
      var s = (l.lead_surveys && l.lead_surveys[0]) || null;
      var wa = waNumber(l.mobile);
      var opts = STATUSES.map(function (v) {
        return '<option value="' + v + '"' + (l.status === v ? ' selected' : '') + '>' +
               v.charAt(0).toUpperCase() + v.slice(1) + '</option>';
      }).join('');

      return '' +
      '<article class="lead" data-id="' + esc(l.id) + '">' +
        '<div class="top">' +
          '<div class="who"><b>' + esc(l.name) + '</b><time>' + esc(when(l.created_at)) + '</time></div>' +
          '<span class="tag">' + esc(l.source) + '</span>' +
        '</div>' +
        '<dl>' +
          '<dt>Mobile</dt><dd>' + esc(l.mobile) + '</dd>' +
          '<dt>Area</dt><dd>' + esc(l.area) + '</dd>' +
          '<dt>Problem</dt><dd>' + esc(TYPE_LABEL[l.leakage_type] || l.leakage_type) + '</dd>' +
          (s && s.leak_location ? '<dt>Location</dt><dd>' + esc(s.leak_location) + '</dd>' : '') +
          (s && s.duration ? '<dt>Since</dt><dd>' + esc(s.duration) + '</dd>' : '') +
          (s && s.tried_before ? '<dt>Tried before</dt><dd>' + esc(s.tried_before) + '</dd>' : '') +
          (l.utm_source ? '<dt>Campaign</dt><dd>' + esc(l.utm_source) + (l.utm_campaign ? ' / ' + esc(l.utm_campaign) : '') + '</dd>' : '') +
        '</dl>' +
        '<div class="actions">' +
          '<a class="call" href="tel:+' + esc(wa) + '">Call</a>' +
          '<a class="wa" href="https://wa.me/' + esc(wa) + '" target="_blank" rel="noopener">WhatsApp</a>' +
        '</div>' +
        '<div class="row"><select class="status">' + opts + '</select><span class="saved"></span></div>' +
        '<textarea class="notes" placeholder="Notes...">' + esc(l.notes || '') + '</textarea>' +
      '</article>';
    }).join('');

    Array.prototype.forEach.call(host.querySelectorAll('.lead'), function (card) {
      var id = card.getAttribute('data-id');
      var flag = card.querySelector('.saved');
      card.querySelector('.status').onchange = function () {
        patch(id, { status: this.value }, flag).then(function () { renderStats(); renderChips(); });
      };
      var notes = card.querySelector('.notes');
      notes.onblur = function () {
        var row = leads.filter(function (l) { return l.id === id; })[0];
        if (row && (row.notes || '') === notes.value) return;
        patch(id, { notes: notes.value }, flag);
      };
    });
  };

  /* ---------------- CSV ---------------- */
  window.akExport = function () {
    var cols = ['created_at', 'name', 'mobile', 'area', 'leakage_type', 'source',
                'status', 'notes', 'leak_location', 'duration', 'tried_before',
                'utm_source', 'utm_medium', 'utm_campaign', 'referrer'];
    var cell = function (v) { return '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"'; };

    var lines = [cols.join(',')];
    visible().forEach(function (l) {
      var s = (l.lead_surveys && l.lead_surveys[0]) || {};
      lines.push(cols.map(function (c) {
        if (c === 'leak_location' || c === 'duration' || c === 'tried_before') return cell(s[c]);
        return cell(l[c]);
      }).join(','));
    });

    // BOM keeps Excel happy with any non-ASCII names
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = window.URL.createObjectURL(blob);
    a.download = 'ak-leads-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { window.URL.revokeObjectURL(a.href); }, 1000);
  };

  /* ---------------- boot ---------------- */
  function start() {
    document.getElementById('login').hidden = true;
    document.getElementById('app').hidden = false;
    akLoad();
  }

  session = loadSession();
  if (session && session.access_token) start(); else showLogin('');
})();
</script>
</body>
</html>
